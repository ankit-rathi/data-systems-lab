name: Release Gate
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  release-gate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install notebook execution dependencies
        run: python -m pip install nbclient nbformat ipykernel
      - name: Repository release gate
        run: python tools/release_check.py
      - name: Notebook smoke set
        run: python tools/smoke_notebooks.py
