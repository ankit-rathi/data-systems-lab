<text x="70" y="75" font-family="Comic Sans MS,Segoe Print,cursive" font-size="38" font-weight="700" fill="#172033">09 · Transactions &amp; Concurrency</text>
<text x="72" y="125" font-family="Comic Sans MS,Segoe Print,cursive" font-size="24" fill="#b24b43">Think in systems, not syntax.</text>
<path d="M70 150 C220 135 350 170 520 145 S760 140 830 155" fill="none" stroke="#e1b34a" stroke-width="10" opacity=".65"/>
<text x="70" y="205" font-family="Comic Sans MS,Segoe Print,cursive" font-size="24" fill="#172033">Concurrency is about which interleavings a system permits and exposes.</text>
<g transform="rotate(-1 135 290)"><rect x="55" y="255" width="150" height="70" rx="12" fill="#fff1b8" stroke="#172033" stroke-width="3"/><text x="135" y="297" text-anchor="middle" font-family="Comic Sans MS,Segoe Print,cursive" font-size="20" font-weight="700" fill="#172033">read</text></g><g transform="rotate(1 320 400)"><rect x="240" y="365" width="150" height="70" rx="12" fill="#e8f1ff" stroke="#172033" stroke-width="3"/><text x="320" y="407" text-anchor="middle" font-family="Comic Sans MS,Segoe Print,cursive" font-size="20" font-weight="700" fill="#172033">write</text></g><g transform="rotate(-1 505 290)"><rect x="425" y="255" width="150" height="70" rx="12" fill="#e9f7ee" stroke="#172033" stroke-width="3"/><text x="505" y="297" text-anchor="middle" font-family="Comic Sans MS,Segoe Print,cursive" font-size="20" font-weight="700" fill="#172033">conflict</text></g><g transform="rotate(1 690 400)"><rect x="610" y="365" width="150" height="70" rx="12" fill="#fde5e1" stroke="#172033" stroke-width="3"/><text x="690" y="407" text-anchor="middle" font-family="Comic Sans MS,Segoe Print,cursive" font-size="20" font-weight="700" fill="#172033">isolation</text></g>
<text x="70" y="515" font-family="Comic Sans MS,Segoe Print,cursive" font-size="19" fill="#697588">Sketch it → predict it → break it → explain it.</text>
